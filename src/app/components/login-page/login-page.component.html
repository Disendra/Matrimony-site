<div class="login-container">
  <!-- Background Image -->
  <div class="background-image"></div>

  <!-- Overlay for darkening the background -->
  <div class="overlay"></div>
  <!-- Login Form -->
  <div class="login-form">
    <h2 class="text-center text-white">Login</h2>
    <form (ngSubmit)="onLogin()" #loginForm="ngForm">
      <div class="form-group mb-3">
        <input type="text" class="form-control" placeholder="Mobile Number" name="mobileNumber"
          [(ngModel)]="loginData.mobileNumber" required />
      </div>
      <div class="form-group mb-3">
        <input type="password" class="form-control" placeholder="Password" name="password"
          [(ngModel)]="loginData.password" required />
      </div>

      <button type="submit" class="btn btn-danger w-100" [disabled]="!loginForm.form.valid">Login</button>

      <div *ngIf="errorMessage" class="alert alert-danger mt-3 text-center">
        {{ errorMessage }}
      </div>
    </form>


    <div class="d-flex justify-content-between mt-3">
      <a class="text-white" routerLink="/forgot-password">Forgot Password?</a>
      <a class="text-white" routerLink="/create-account">Create Account</a>
    </div>
  </div>
</div>

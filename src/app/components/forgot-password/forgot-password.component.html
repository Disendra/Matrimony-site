<app-header></app-header>
<div class="container-fluid d-flex justify-content-center align-items-center min-vh-100 heart-bg">
  <div class="card p-4 shadow">
    <h3 class="text-center mb-4">Enter Your Registered Mobile Number</h3>

    <!-- Step 1: Mobile Number -->
    <form (ngSubmit)="onSubmit()" *ngIf="!showOtp">
      <div class="mb-3">
        <input type="text" class="form-control rounded-pill" placeholder="Mobile Number"
               name="mobileNumber" [(ngModel)]="mobileNumber" required />
      </div>
      <div class="d-grid">
        <button type="submit" class="btn btn-danger rounded-pill">Reset</button>
      </div>
    </form>

    <!-- Step 2: OTP Boxes -->
    <div *ngIf="showOtp">
      <h5 class="text-center">Enter OTP sent to {{ mobileNumber }}</h5>
      <div class="d-flex justify-content-center gap-2 my-3">
        <input type="text" maxlength="1" class="form-control text-center" style="width: 50px;"
               name="otp1" [(ngModel)]="otp1" />
        <input type="text" maxlength="1" class="form-control text-center" style="width: 50px;"
               name="otp2" [(ngModel)]="otp2" />
        <input type="text" maxlength="1" class="form-control text-center" style="width: 50px;"
               name="otp3" [(ngModel)]="otp3" />
        <input type="text" maxlength="1" class="form-control text-center" style="width: 50px;"
               name="otp4" [(ngModel)]="otp4" />
      </div>
      <div class="d-grid">
        <button class="btn btn-success rounded-pill" (click)="verifyOtp()">Verify OTP</button>
      </div>
    </div>
  </div>
</div>
